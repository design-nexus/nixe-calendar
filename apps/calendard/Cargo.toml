[package]
name = "nyx-calendard"
version = "0.1.1"
description = "Calendar reminders and the agenda for Glimpse, in the background"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-calendard"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gio = "0.22"
glib = "0.22"
nyx-calendar-core = { path = "../../crates/nyx-calendar-core" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c", default-features = false }
nyx-eds = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
gio = "0.22"
glib = "0.22"
nyx-eds = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
