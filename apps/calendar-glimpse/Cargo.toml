[package]
name = "nyx-calendar-glimpse"
version = "0.1.1"
description = "Glimpse plugin for the agenda on this computer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-calendar-glimpse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glimpse-plugin-sdk = { git = "https://github.com/design-nexus/nyx-glimpse.git", rev = "6f9f7325259bb05c2bc6a5eb1920ce6caed7aa82" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
