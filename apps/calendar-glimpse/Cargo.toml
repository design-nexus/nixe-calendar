[package]
name = "nixe-calendar-glimpse"
version = "0.1.1"
description = "Glimpse plugin for the agenda on this computer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nixe-calendar-glimpse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glimpse-plugin-sdk = { git = "https://github.com/design-nexus/nixe-glimpse.git", rev = "e60055b3b10793646b07bcb8b403ef1c67cdfd01" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
