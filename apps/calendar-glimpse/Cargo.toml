[package]
name = "nixe-calendar-glimpse"
version = "0.1.0"
description = "Glimpse plugin for the agenda on this computer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nixe-calendar-glimpse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glimpse-plugin-sdk = { git = "https://github.com/design-nexus/nixe-glimpse.git", rev = "7da103687afe03d14879635c46a0d5a69f83754d" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
